name: lms_user_app
description: A new Flutter project.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ">=3.0.2 <4.0.0"

dependencies:
  appinio_video_player: ^1.2.2

  cached_video_player:
    git:
      url: https://github.com/vikram25897/flutter_cached_video_player
      ref: feature/gradle_version_bump

  better_player: ^0.0.83
  cached_network_image: ^3.2.3
  carousel_slider: ^4.2.1
  connectivity_plus: ^3.0.2
  country_code_picker: ^2.0.2
#  country_pickers: ^2.0.0
  cupertino_icons: ^1.0.2
  file_picker: ^4.6.1
  firebase_auth: ^4.2.6
  firebase_core: ^2.4.1
  firebase_messaging: ^14.2.1
  fl_chart: ^0.63.0
  flutter:
    sdk: flutter
  flutter_downloader: ^1.8.3
  flutter_facebook_auth: ^5.0.7
  flutter_html: ^3.0.0-alpha.5
  flutter_local_notifications: ^9.5.3+1
  flutter_rating_bar: ^4.0.1
  flutter_svg: ^1.1.6
  flutter_switch: ^0.3.2
  flutter_widget_from_html: ^0.8.5
  fluttertoast: ^8.0.9
  gap: ^3.0.1
  get: ^4.6.5
  get_storage: ^2.0.3
  google_sign_in: ^5.4.4
  http: ^0.13.5
  image_picker: ^0.8.5+3
  intl: ^0.17.0
  json_annotation: ^4.8.0
  modal_bottom_sheet: null
  pagination_view: ^2.0.0
  path: ^1.0.0
  path_provider: ^2.0.11
  phone_number: ^1.0.0
  pin_code_fields: ^8.0.1
  pointer_interceptor: null
  shared_preferences: ^2.0.15
  shimmer_animation: ^2.1.0+1
  smooth_page_indicator: ^1.0.0+2
  text_scroll: ^0.1.2
  universal_html: ^2.0.9
  universal_platform: ^1.0.0+1
  url_launcher: ^6.1.3
  # webview_universal: ^0.0.1
  webview_flutter: ^3.0.4
  # webview_universal: any


dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/images/
    - assets/languages/
  # the material Icons class.
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
